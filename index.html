<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Music</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

  <div class="container">
    <div class="topBar">
      <i class="fa-solid fa-chevron-down"></i>
      <p>Now Playing</p>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>

    <div class="img-area">
      <div class="bg-div"></div>
      <img src="" alt="img" id="songImg">
      
      <div class="song-details">
        <p class="name">Song Name</p>
        <p class="artist">Artist Name</p>
      </div>
    </div>

    <div class="progress-area">
      <div class="progress-bar">
        <div class="progress"></div>
        <audio src="" id="main-audio"></audio>
      </div>
      <div class="time-song">
        <span class="current-time">00:00</span>
        <span class="max-duration">00:00</span>
      </div>
    </div>

    <div class="controls">
      <i id="repeat" class="fa-solid fa-repeat" title="Repeat"></i>
      <i id="prev" class="fa-solid fa-backward-step" title="Previous"></i>
      <div class="play-pause">
        <i class="fa-solid fa-circle-play" id="playPauseBtn" title="Play"></i>
      </div>
      <i id="next" class="fa-solid fa-forward-step" title="Next"></i>
      <i class="fa-solid fa-list" title="Playlist"></i>
    </div>
  </div>

  <script src="js/music-list.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
